<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" role="img" aria-label="Logerithm News">
  <title>Logerithm News</title>

  <!-- Icon: stylized L with a logarithm curve -->
  <g transform="translate(4, 6)">
    <!-- Vertical bar of L -->
    <rect x="0" y="0" width="7" height="44" rx="2" fill="#DC2626"/>
    <!-- Horizontal bar of L -->
    <rect x="0" y="37" width="22" height="7" rx="2" fill="#DC2626"/>
    <!-- Logarithm curve arc rising from the L corner -->
    <path d="M 20 37 Q 28 22 36 10 Q 40 4 46 2" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Small dot at curve end -->
    <circle cx="47" cy="2" r="3.5" fill="#DC2626"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#111827" letter-spacing="-0.5">Logerithm</text>
  <text x="66" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#DC2626" letter-spacing="3">NEWS</text>
</svg>
